version: '3.8'
services:
  typesense:
    # Keep in step with the deployed VMs (gateway-infrastructure
    # */scripts/*_typesense_script.sh). Search relies on _rand() sorting,
    # which 26.0 does not support.
    image: typesense/typesense:30.2
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors
    restart: unless-stopped

volumes:
  typesense_data:


  typesense:
    image: typesense/typesense:27.1
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-mhRUuBFVa80ekInFVyEeg3ObdOTpwgbhf6NdFLcQziM23ceK}
      TYPESENSE_DATA_DIR: /data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-mhRUuBFVa80ekInFVyEeg3ObdOTpwgbhf6NdFLcQziM23ceK} --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors
    restart: unless-stopped

